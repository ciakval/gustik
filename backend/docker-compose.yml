services:
  backend:
    build: .
    container_name: gustik
    restart: unless-stopped
    environment:
      - PORT=3000
      - DB_PATH=/app/data/gustik.sqlite
      - INGEST_TOKEN=${INGEST_TOKEN}
    volumes:
      - gustik-data:/app/data
    networks:
      - proxy
    expose:
      - "3000"

networks:
  proxy:
    external: true

volumes:
  gustik-data:
