; Gustik firmware (ESP32-WROOM).
;
; `esp32dev` is the real hardware target, now build-verified by CI
; (.github/workflows/ci.yml) - the devcontainer this project was originally
; scaffolded in never attempted it (assumed hardware-gated; it's actually
; just internet-gated for the toolchain download, first confirmed when the
; CI pipeline was added). Framework is left unpinned to `arduino` default:
; the architecture spine originally called for a pinned "stable 2.x" Arduino-
; ESP32 core, but the PlatformIO registry no longer serves any 2.x
; framework-arduinoespressif32 release at all as of this CI setup - only
; 3.x (resolved 3.20011.230801 against espressif32@6.4.0). The 3.x line is
; clearly the only currently-maintained one, so this pin was corrected
; rather than fought - see cerebrum.md Decision Log for the full note.
; CI has no hardware, but this dev machine DOES (board on /dev/ttyUSB0) -
; `pio run -e esp32dev -t upload` has been run for real many times since
; 2026-08-11, so treat "needs hardware" as a reason to go try it, not a
; reason to defer. See TODO.md for the flash-usage headroom flag (90.6%
; used at last CI build; no OTA partition scheme needed since there's no
; OTA mechanism, so a custom single-app partition table would recover
; meaningful headroom if it's ever needed).
;
; `native` compiles and runs only the hardware-independent logic (pure
; functions with no Arduino.h dependency - correct/, transmit/*.cpp,
; config/*.cpp, plus sense/vane_decode.cpp) on the host, with the Unity
; test framework.

[env:esp32dev]
platform = espressif32 @ ~6.4.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; config/hw/config_loader.cpp uses LittleFS.begin()/LittleFS.open(), but
; PlatformIO's `uploadfs` target defaults to a SPIFFS image without this -
; config.txt would upload but in the wrong filesystem format, so
; LittleFS.open("/config.txt") would silently never find it on boot.
board_build.filesystem = littlefs

[env:native]
platform = native
test_framework = unity
test_build_src = yes
; sense/ is otherwise hardware-coupled, but sense/vane_decode.cpp is
; deliberately Arduino.h-free: the vane ADC->octant table is correctness-
; critical (it has been wrong twice - buglog bug-045, bug-050) and belongs
; under test. Only that one file from sense/ is listed here.
build_src_filter = +<correct/*.cpp> +<transmit/*.cpp> +<config/*.cpp> +<sense/vane_decode.cpp>
build_flags = -DUNITY_INCLUDE_DOUBLE
