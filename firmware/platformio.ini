; Gustik firmware (ESP32-WROOM, ESP32 Arduino core 2.x - see architecture spine
; ARCHITECTURE-SPINE.md for the pinned-version rationale).
;
; `esp32dev` is the real hardware target. It is NOT build-verified in the
; devcontainer this project was scaffolded in - there is no ESP32 toolchain
; download attempted here and no physical hardware to flash. Verify
; `pio run -e esp32dev` on a machine with hardware/toolchain access before
; relying on it (see TODO.md).
;
; `native` compiles and runs only the hardware-independent logic (pure
; functions with no Arduino.h dependency - anything under src/correct/,
; plus any other module explicitly added to build_src_filter below) on the
; host, with the Unity test framework. This is the environment `pio test`
; actually exercises in CI/this session.

[env:esp32dev]
platform = espressif32 @ ~6.4.0
board = esp32dev
framework = arduino
platform_packages =
    framework-arduinoespressif32 @ ~2.0.14
monitor_speed = 115200

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<correct/*.cpp> +<transmit/*.cpp> +<config/*.cpp>
build_flags = -DUNITY_INCLUDE_DOUBLE
