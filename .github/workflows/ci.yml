name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.12'

jobs:
  # ---------------------------------------------------------------------
  # Backend (Node.js/Fastify) — lint, test, build (Dockerfile) verification
  # ---------------------------------------------------------------------

  lint-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint

  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  # Builds backend/Dockerfile on every push/PR (this has no coverage
  # anywhere else - the devcontainer this project was scaffolded in has no
  # docker binary). On a push to main only, also pushes the built image to
  # GHCR (tagged :latest and :<sha>) - deploy-backend then just pulls that
  # tag and runs it, instead of rebuilding from source on the server. PRs
  # and other branches get build-only verification, no push (no reason to
  # publish an image for code that isn't deploying).
  build-backend-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/gustik-backend:latest
            ghcr.io/${{ github.repository_owner }}/gustik-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------
  # Firmware (PlatformIO/ESP32) — static analysis, native unit tests,
  # real esp32dev build (this devcontainer has never downloaded the ESP32
  # toolchain; GitHub's runners have full internet access and no hardware
  # gating, so this is the first real build-verification of [env:esp32dev]).
  # ---------------------------------------------------------------------

  lint-firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install platformio
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-native-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: platformio-native-
      # cppcheck via the native env (no ESP32 toolchain needed for static
      # analysis). Only fails on HIGH-severity defects - a first pass on
      # this codebase found 26 LOW-severity false-positive "unused
      # function" notes (cppcheck can't see cross-file usage without
      # whole-program mode) and zero HIGH/MEDIUM, so HIGH is a safe,
      # meaningful gate without pre-existing noise breaking every build.
      - run: pio check -e native --skip-packages --fail-on-defect=high

  test-firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install platformio
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-native-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: platformio-native-
      - run: pio test -e native

  build-firmware-esp32:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install platformio
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-esp32dev-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: platformio-esp32dev-
      - run: pio run -e esp32dev
      - uses: actions/upload-artifact@v4
        with:
          name: gustik-firmware-esp32dev-${{ github.sha }}
          path: |
            firmware/.pio/build/esp32dev/firmware.bin
            firmware/.pio/build/esp32dev/firmware.elf
            firmware/.pio/build/esp32dev/bootloader.bin
            firmware/.pio/build/esp32dev/partitions.bin
          if-no-files-found: error
          retention-days: 90

  # ---------------------------------------------------------------------
  # Gate job - single required status check for branch protection,
  # regardless of how many jobs above this line get added/renamed later.
  # ---------------------------------------------------------------------

  ci-success:
    if: always()
    needs:
      - lint-backend
      - test-backend
      - build-backend-image
      - lint-firmware
      - test-firmware
      - build-firmware-esp32
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]] || \
             [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required CI jobs did not succeed:"
            echo '${{ toJSON(needs) }}'
            exit 1
          fi

  # ---------------------------------------------------------------------
  # Deploy backend — real deployment over SSH, main branch only.
  #
  # Gated on a repository VARIABLE (Settings > Secrets and variables >
  # Actions > Variables), not a secret - job-level `if:` conditions can't
  # read the secrets context at all (actionlint catches this), so the
  # secrets themselves can't double as their own on/off switch. Flip the
  # switch once everything below is in place:
  #
  #   DEPLOY_ENABLED (Variable) = true   - explicit opt-in, keeps this job
  #                                        a no-op (not a failure) until
  #                                        deployment is actually ready
  #
  # Requires these repository variables (Settings > Variables):
  #   VPS_HOST       - server hostname
  #   VPS_USER       - SSH user
  #   VPS_SSH_PORT   - SSH port
  #   DEPLOY_DIR     - absolute path on the server to sync compose.yaml
  #                    into and run `docker compose` from
  # and this repository secret:
  #   VPS_SSH_KEY    - private key (PEM), matching a public key already
  #                    in that user's ~/.ssh/authorized_keys on the server
  #
  # Strategy: the image is already built and pushed to GHCR by
  # build-backend-image above (tags :latest and :<sha>) - this job never
  # builds anything itself. It ships only compose.yaml to the server (not
  # the source tree - nothing to build there anymore), logs the server
  # into GHCR using this run's own short-lived GITHUB_TOKEN (never stored
  # permanently - each deploy re-authenticates fresh), then
  # `docker compose pull && up -d`. Chosen over rsync-and-build-on-server
  # (the original approach) because the image the server runs is then
  # provably the exact same bytes build-backend-image already
  # build-verified in CI, not a separate rebuild that could drift from
  # what CI tested. .env is written fresh on every deploy from the
  # INGEST_TOKEN secret (see "Write .env on the server" below) - it's
  # GitHub-managed now, not a hand-maintained server file.
  #
  # The container joins the pre-existing external Docker network `proxy`,
  # which Caddy (a separate, human-managed compose project on the same
  # host, not touched by this workflow) also sits on - Caddy's Caddyfile
  # reverse-proxies gustik.remesh.cz to this container by its container_name
  # (`gustik`) on port 3000. No port is published to the host; Caddy owns
  # 80/443 there.
  # ---------------------------------------------------------------------

  deploy-backend:
    needs: [lint-backend, test-backend, build-backend-image]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_SSH_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync compose.yaml to server
        env:
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_SSH_PORT" "$VPS_USER@$VPS_HOST" \
            "mkdir -p '$DEPLOY_DIR'"
          rsync -az -e "ssh -i ~/.ssh/deploy_key -p $VPS_SSH_PORT" \
            backend/compose.yaml "$VPS_USER@$VPS_HOST:$DEPLOY_DIR/compose.yaml"

      - name: Write .env on the server
        env:
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_SSH_PORT" "$VPS_USER@$VPS_HOST" \
            "cat > '$DEPLOY_DIR/.env'" <<EOF
          INGEST_TOKEN=$INGEST_TOKEN
          EOF

      - name: Log in to GHCR on the server
        env:
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_SSH_PORT" "$VPS_USER@$VPS_HOST" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin" <<< "$GHCR_TOKEN"

      - name: Pull and restart on the server
        env:
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_SSH_PORT" "$VPS_USER@$VPS_HOST" \
            "cd '$DEPLOY_DIR' && docker compose pull && docker compose up -d && docker image prune -f --filter 'label=com.docker.compose.project=gustik'"

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            if curl -fsS https://gustik.remesh.cz/health > /dev/null; then
              echo "Health check passed"
              exit 0
            fi
            sleep 3
          done
          echo "Health check failed after deploy"
          exit 1

  # ---------------------------------------------------------------------
  # Package firmware as a release artifact (not a real device deploy -
  # there is no OTA mechanism, a station is flashed by hand once). Runs
  # on version tags (v1.0.0 etc); every push to main/dev already gets a
  # 90-day workflow artifact from build-firmware-esp32 above regardless.
  # ---------------------------------------------------------------------

  release-firmware:
    needs: build-firmware-esp32
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gustik-firmware-esp32dev-${{ github.sha }}
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "Firmware ${{ github.ref_name }}" \
            --notes "Automated esp32dev build from ${{ github.sha }}. Flash with \`pio run -t upload -e esp32dev\`, or manually with esptool using firmware.bin/bootloader.bin/partitions.bin."
